name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Backend (core/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      # pnpm version from "packageManager" in the root package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # One workspace (pnpm-workspace.yaml): installs core, web and site
      - run: pnpm install --frozen-lockfile
      # ffmpeg: the Telegram voice-note tests decode and encode real audio.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm typecheck
      # Tests use a fake chat model: no API keys or network LLM calls.
      - run: pnpm test

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # pnpm version from "packageManager" in the root package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # One workspace (pnpm-workspace.yaml): installs core, web and site
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  site:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      # pnpm version from "packageManager" in the root package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # One workspace (pnpm-workspace.yaml): installs core, web and site
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
