[project]
name = "luna"
version = "0.1.0"
description = "Voice-first personal assistant on LangGraph with subagents, memory and MCP tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["langgraph", "langchain", "agent", "assistant", "mcp", "voice"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    { name = "Akshay shahi", email = "shahiakshay900@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain[mcp]>=1.4.3",
    "langchain-openai>=1.1.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic-settings>=2.15.0",
    "langchain-tavily>=0.2.18",
    "starlette>=1.7.0",
    "uvicorn[standard]>=0.54.0",
    "piper-tts>=1.8.0",
    "faster-whisper>=1.2.0",
    "numpy>=2.0",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/Akshayshahi900/Luna"
Repository = "https://github.com/Akshayshahi900/Luna"
Issues = "https://github.com/Akshayshahi900/Luna/issues"

[project.scripts]
luna = "luna:main"
luna-web = "luna.web:main"
luna-google-auth = "luna.integrations.google:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
