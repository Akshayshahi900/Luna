[project]
name = "luna"
version = "0.1.0"
description = "Scalable LangGraph chatbot with memory and MCP tools"
readme = "README.md"
authors = [
    { name = "Akshay shahi", email = "shahiakshay900@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain[mcp]>=1.4.3",
    "langchain-openai>=1.1.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
luna = "luna:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
